services:
  backend:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL}?ssl=require
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DESIGNER_EMAIL: ${DESIGNER_EMAIL}
      DESIGNER_PASSWORD: ${DESIGNER_PASSWORD}
      FRONTEND_URL: https://app.thesocialchutneyco.com
      EMERGENT_EMAIL_KEY: ${EMERGENT_EMAIL_KEY}
      EMAIL_FROM_NAME: The Social Chutney Co.
    command:
      - /bin/sh
      - -ec
      - |
        python -c "import urllib.request; urllib.request.urlretrieve('https://github.com/socialchutneylab-max/project-1/releases/download/deploy-__DEPLOY_SHA__/backend.tar.gz', '/tmp/backend.tar.gz')"
        tar -xzf /tmp/backend.tar.gz -C /app
        pip install --no-cache-dir -r /app/requirements-production.txt
        exec uvicorn server:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips '*'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 90s
  backend-gateway:
    networks: [default, web]
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80"
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          location = /api/auth/register { return 403; }
          location / {
            proxy_pass http://backend:8001;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $$remote_addr;
          }
        }
        EOF
        nginx -g 'daemon off;'
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.socialchutney-api-http.rule=Host(`backend.thesocialchutneyco.com`)
      - traefik.http.routers.socialchutney-api-http.entrypoints=web
      - traefik.http.routers.socialchutney-api-http.middlewares=socialchutney-https
      - traefik.http.middlewares.socialchutney-https.redirectscheme.scheme=https
      - traefik.http.middlewares.socialchutney-https.redirectscheme.permanent=true
      - traefik.http.routers.socialchutney-api-http.service=socialchutney-api
      - traefik.http.routers.socialchutney-api.rule=Host(`backend.thesocialchutneyco.com`)
      - traefik.http.routers.socialchutney-api.entrypoints=websecure
      - traefik.http.routers.socialchutney-api.tls=true
      - traefik.http.routers.socialchutney-api.tls.certresolver=myresolver
      - traefik.http.routers.socialchutney-api.service=socialchutney-api
      - traefik.http.services.socialchutney-api.loadbalancer.server.port=80
  frontend:
    networks: [web]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "3000"
    command:
      - /bin/sh
      - -ec
      - |
        wget -qO /tmp/frontend.tar.gz 'https://github.com/socialchutneylab-max/project-1/releases/download/deploy-__DEPLOY_SHA__/frontend.tar.gz'
        tar -xzf /tmp/frontend.tar.gz -C /usr/share/nginx/html
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 3000;
          root /usr/share/nginx/html;
          index index.html;
          location / { try_files $$uri $$uri/ /index.html; }
          location = /deploy-version.txt { add_header Cache-Control "no-store" always; }
          location = /index.html { add_header Cache-Control "no-cache" always; }
        }
        EOF
        exec nginx -g 'daemon off;'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:3000/deploy-version.txt']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.socialchutney-app-http.rule=Host(`app.thesocialchutneyco.com`)
      - traefik.http.routers.socialchutney-app-http.entrypoints=web
      - traefik.http.routers.socialchutney-app-http.middlewares=socialchutney-https
      - traefik.http.routers.socialchutney-app-http.service=socialchutney-app
      - traefik.http.routers.socialchutney-app.rule=Host(`app.thesocialchutneyco.com`)
      - traefik.http.routers.socialchutney-app.entrypoints=websecure
      - traefik.http.routers.socialchutney-app.tls=true
      - traefik.http.routers.socialchutney-app.tls.certresolver=myresolver
      - traefik.http.routers.socialchutney-app.service=socialchutney-app
      - traefik.http.services.socialchutney-app.loadbalancer.server.port=3000
networks:
  web:
    external: true
